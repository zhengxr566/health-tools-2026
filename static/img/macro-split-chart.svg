<text x="24.0" y="366.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">热量不同时，克数按比例增减；例如 1,600 kcal 维持期：蛋白质 100 g、碳水 180 g、脂肪 53 g。</text>
<text x="746" y="376" text-anchor="end" font-size="12" fill="#9ca3af">calmyhealth.com</text>
