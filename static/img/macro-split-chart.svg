<text x="237.0" y="176.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">150 g</text>
<rect x="324.0" y="128" width="201.0" height="30" rx="4" fill="#e8b23a"/>
<text x="425.5" y="148.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">35%</text>
<text x="425.5" y="176.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">175 g</text>
