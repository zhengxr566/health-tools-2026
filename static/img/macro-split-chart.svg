<text x="440.0" y="280.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">50%</text>
<text x="440.0" y="308.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">250 g</text>
