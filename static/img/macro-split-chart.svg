<text x="628.5" y="148.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">35%</text>
<text x="628.5" y="176.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">78 g</text>
<text x="24.0" y="214.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">维持期</text>
