<text x="222.5" y="242.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">125 g</text>
<rect x="295.0" y="194" width="259.0" height="30" rx="4" fill="#e8b23a"/>
<text x="425.5" y="214.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">45%</text>
<text x="425.5" y="242.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">225 g</text>
<rect x="556.0" y="194" width="172.0" height="30" rx="4" fill="#4f7fe0"/>
<text x="643.0" y="214.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">30%</text>
<text x="643.0" y="242.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">67 g</text>
<text x="24.0" y="280.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">增肌期</text>
<rect x="150.0" y="260" width="143.0" height="30" rx="4" fill="#d1495b"/>
<text x="222.5" y="280.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">25%</text>
<text x="222.5" y="308.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">125 g</text>
