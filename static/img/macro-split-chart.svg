<text x="127.0" y="94.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal">碳水</text>
<rect x="177" y="82" width="14" height="14" rx="3" fill="#4f7fe0"/>
<text x="197.0" y="94.0" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal">脂肪</text>
<text x="24.0" y="148.0" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">减脂期</text>
