<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif" role="img">
<title>三大营养素比例与克数对照图（减脂、维持、增肌）</title>
<desc>三大营养素比例与克数对照图（减脂、维持、增肌）</desc>
<rect width="760" height="388" fill="#ffffff"/>
<text x="24.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="start" font-weight="bold">三大营养素怎么分配？按目标对照（2,000 kcal）</text>
<text x="24.0" y="64.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">与本站宏量营养素计算器相同的比例；蛋白质、碳水 1 g = 4 kcal，脂肪 1 g = 9 kcal</text>
<rect x="24" y="82" width="14" height="14" rx="3" fill="#d1495b"/>
