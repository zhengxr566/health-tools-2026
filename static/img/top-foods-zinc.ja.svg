<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>亜鉛が多い食品ランキング（1回量あたり）</title>
<desc>身近な食品の1回量あたりの亜鉛量・上位12の棒グラフ。</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="24.0" y="42.0" font-size="22" fill="#1f2937" text-anchor="start" font-weight="bold">亜鉛が多い身近な食品（1回量あたり）</text>
<text x="24.0" y="68.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">よく食べる1回量で計算。色は栄養グループ。参考：成人1日約8 mg（計算用の目安）</text>
