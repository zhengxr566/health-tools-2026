<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>マグネシウムが多い食品ランキング（1回量あたり）</title>
<desc>身近な食品の1回量あたりのマグネシウム量・上位12の棒グラフ。</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="24.0" y="42.0" font-size="22" fill="#1f2937" text-anchor="start" font-weight="bold">マグネシウムが多い身近な食品（1回量あたり）</text>
<text x="24.0" y="68.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">よく食べる1回量で計算。色は栄養グループ。参考：成人1日約330 mg（計算用の目安）</text>
<text x="24.0" y="129.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">さば（100 g）</text>
<rect x="250" y="115" width="400.0" height="20" rx="3" fill="#d1495b"/>
<text x="658.0" y="129.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">97 mg</text>
<text x="24.0" y="159.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">ほうれん草（100 g）</text>
<rect x="250" y="145" width="255.7" height="20" rx="3" fill="#1d7a3e"/>
<text x="513.7" y="159.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">62 mg</text>
<text x="24.0" y="189.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">玄米ごはん（150 g）</text>
<rect x="250" y="175" width="241.2" height="20" rx="3" fill="#6c757d"/>
<text x="499.2" y="189.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">58 mg</text>
<text x="24.0" y="219.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">豆乳（無調整）（250 g）</text>
<rect x="250" y="205" width="237.1" height="20" rx="3" fill="#c9a227"/>
<text x="495.1" y="219.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">58 mg</text>
<text x="24.0" y="249.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">オートミール（40 g）</text>
<rect x="250" y="235" width="227.6" height="20" rx="3" fill="#9a6b3f"/>
<text x="485.6" y="249.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">55 mg</text>
<text x="24.0" y="279.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">絹ごし豆腐（150 g）</text>
<rect x="250" y="265" width="222.7" height="20" rx="3" fill="#c9a227"/>
<text x="480.7" y="279.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">54 mg</text>
<text x="24.0" y="309.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">豆花（無糖）（200 g）</text>
<rect x="250" y="295" width="197.9" height="20" rx="3" fill="#c9a227"/>
<text x="455.9" y="309.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">48 mg</text>
<text x="24.0" y="339.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">アーモンド（15 g）</text>
<rect x="250" y="325" width="172.6" height="20" rx="3" fill="#c9a227"/>
<text x="430.6" y="339.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">42 mg</text>
<text x="24.0" y="369.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">さつまいも（150 g）</text>
<rect x="250" y="355" width="167.0" height="20" rx="3" fill="#f08c2e"/>
<text x="425.0" y="369.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">40 mg</text>
<text x="24.0" y="399.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">オクラ（80 g）</text>
<rect x="250" y="385" width="164.9" height="20" rx="3" fill="#5fa83b"/>
<text x="422.9" y="399.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">40 mg</text>
<text x="24.0" y="429.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">カシューナッツ（15 g）</text>
<rect x="250" y="415" width="156.5" height="20" rx="3" fill="#c9a227"/>
<text x="414.5" y="429.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">38 mg</text>
<text x="24.0" y="459.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">パスタ（ゆで）（200 g）</text>
<rect x="250" y="445" width="148.5" height="20" rx="3" fill="#6c757d"/>
<text x="406.5" y="459.0" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">36 mg</text>
<text x="24.0" y="504.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">データ：台湾食品栄養成分データベース、USDA FoodData Central。ビタミンAはレチノール活性当量（RAE）。</text>
<text x="744" y="528" text-anchor="end" font-size="12" fill="#9ca3af">calmyhealth.com</text>
