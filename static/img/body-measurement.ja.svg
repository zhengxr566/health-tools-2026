<text x="410" y="516" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">毎回同じ位置・同じ時間帯に測る。</text>
<text x="704" y="546" text-anchor="end" font-size="12" fill="#9ca3af">calmyhealth.com</text>
