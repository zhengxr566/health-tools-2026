<text x="24.0" y="64.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">步幅 ≈ 身高 × 0.415（男）/ 0.413（女），距離 = 步數 × 步幅；身高 170 cm 的男性 1 萬步約 7.1 km</text>
