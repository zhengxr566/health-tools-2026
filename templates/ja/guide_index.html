{% extends "ja/base.html" %}
{% block content %}
<div class="bg-white rounded-4 shadow-sm p-4 mb-4">
  <h1 class="h3 mb-2">健康ガイド</h1>
  <p class="text-muted mb-0">
    BMI、歩数、睡眠など、よくある疑問を「数字の根拠」「研究でわかっていること」「日常での使い方」に分けて解説します。
    各記事には参考文献と、すぐに計算できるツールへのリンクを載せています。
  </p>
</div>

<div class="row g-3">
  {% for a in articles %}
  <div class="col-12 col-lg-6">
    <a class="guide-card bg-white rounded-4 shadow-sm p-4 h-100 d-block" href="/guide/{{ a.slug }}">
      <div class="small text-success fw-semibold mb-1">{{ a.category }}</div>
      <h2 class="h6 mb-2">{{ a.h1 }}</h2>
      <p class="text-muted small mb-2">{{ a.description }}</p>
      <div class="small text-muted">{{ a.updated }} · 約 {{ a.read_minutes }} 分</div>
    </a>
  </div>
  {% endfor %}
</div>

<style>
  .guide-card { text-decoration: none; color: inherit; }
  .guide-card:hover h2 { color: #198754; }
</style>
{% endblock %}
