{# 简体 / 繁体 / 日语三个版本共用的页面样式 #}
  <style>
    :root {
      --site-bg: #f5f7fb;
      --panel-bg: #ffffff;
      --line: #e7edf5;
      --text-soft: #6b7280;
      --text-main: #1f2937;
      --brand: #198754;
      --brand-soft: #edf8f2;
      --hover-bg: #f4f7fb;
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.06);
      --topbar-h: 76px;
      --sidebar-w: 290px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--site-bg);
      color: var(--text-main);
      font-size: 15px;
    }


    .navbar.topbar{
      min-height: var(--topbar-h);
      background: rgba(255, 255, 255, 0.96) !important;
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 2px solid rgba(25, 135, 84, 0.52);
      position: sticky;
      top: 0;
      z-index: 1040;
    }

    .topbar .container-fluid,
    .topbar .navbar-collapse {
      position: relative;
      z-index: 1041;
    }

    .topbar .container-fluid {
      padding-left: 18px;
      padding-right: 18px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      min-width: 0;
    }

    .topbar .navbar-brand.brand-mark {
      color: #111827 !important;
      margin-bottom: 0;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
    }

    .brand-logo img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: block;
    }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-text-main {
      font-size: 1.03rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111827 !important;
    }

    .brand-text-sub {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-top: 2px;
    }

    .menu-toggle {
      width: 36px;
      height: 36px;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      flex: 0 0 36px;
    }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: #1f2937;
      border-radius: 999px;
      margin-left: 2px;
      transition: all .18s ease;
    }

    .menu-toggle:hover span:nth-child(1) {
      transform: translateY(-1px);
    }

    .menu-toggle:hover span:nth-child(3) {
      transform: translateY(1px);
    }

    .topbar .navbar-nav {
      flex-wrap: nowrap;
    }

    .topbar .nav-link {
      color: #4b5563 !important;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.48rem 0.9rem;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .topbar .nav-link:hover {
      background: #f3f7f5;
      color: #198754 !important;
    }

    .topbar .nav-link.active {
      background: #edf8f2;
      color: #198754 !important;
      box-shadow: inset 0 0 0 1px rgba(25, 135, 84, 0.12);
    }

    .topbar-links-meta{
      display: flex;
      align-items: flex-start;
      gap: 0.1rem;
      margin-left: 1.1rem;
      align-self: flex-start;
      padding-top: 2px;
    }

    .topbar-links-meta .nav-link{
      font-size: 0.74rem;
      font-weight: 500;
      color: #6b7280 !important;
      padding: 0.18rem 0.42rem;
      line-height: 1.2;
      border-radius: 0.5rem;
    }

    .topbar-links-meta .nav-link:hover {
      background: #f4f7fb;
      color: #198754 !important;
    }

    .topbar-links-meta .nav-link.active {
      background: transparent;
      color: #198754 !important;
      box-shadow: none;
      font-weight: 600;
    }

    .topbar .navbar-toggler {
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 10px;
      padding: 0.35rem 0.55rem;
    }

    .topbar .navbar-toggler:focus {
      box-shadow: none;
    }

    .site-shell {
      min-height: calc(100vh - var(--topbar-h));
    }

    .layout-row {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: calc(100vh - var(--topbar-h));
    }

    .sidebar-panel-wrap {
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      background: var(--panel-bg);
      border-right: 1px solid var(--line);
      min-width: 220px;
      max-width: 480px;
    }

    .sidebar-panel {
      background: var(--panel-bg);
      height: 100%;
      overflow-y: auto;
      padding: 1rem 0.85rem 1.25rem;
      scroll-behavior: auto;
    }

    .sidebar-panel::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar-panel::-webkit-scrollbar-thumb {
      background: #d8e1ec;
      border-radius: 999px;
    }

    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 20;
      background: transparent;
    }

    .sidebar-resizer:hover {
      background: rgba(25, 135, 84, 0.12);
    }

    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      padding: 0 0.45rem;
      color: #111827;
    }

    .sidebar-section-title {
      font-size: 0.83rem;
      font-weight: 700;
      color: #4b5563;
      margin: 0.8rem 0 0.35rem;
      padding: 0 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sidebar-group {
      margin-bottom: 0.8rem;
    }

    .sidebar-link {
      display: block;
      padding: 0.48rem 0.65rem;
      margin: 0.08rem 0;
      border-radius: 0.65rem;
      color: #4b5563;
      text-decoration: none;
      line-height: 1.35;
      font-size: 0.93rem;
      transition: all 0.15s ease;
    }

    .sidebar-link:hover {
      background: var(--hover-bg);
      color: var(--brand);
    }

    .sidebar-link.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
    }

    .sidebar-link small {
      display: block;
      color: var(--text-soft);
      font-size: 0.78rem;
      margin-top: 0.12rem;
    }

    .sidebar-link-top {
      font-size: 0.9rem;
    }

    .sidebar-group-toggle,
    .sidebar-subgroup-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: 0.65rem;
      padding: 0.48rem 0.65rem;
      color: #374151;
      transition: all 0.15s ease;
    }

    .sidebar-group-toggle:hover,
    .sidebar-subgroup-toggle:hover {
      background: var(--hover-bg);
      color: var(--brand);
    }

    .sidebar-group-toggle {
      font-size: 0.93rem;
      font-weight: 700;
    }

    .sidebar-subgroup-toggle {
      font-size: 0.87rem;
      font-weight: 600;
      margin-top: 0.1rem;
    }

    .sidebar-subgroup {
      margin: 0.05rem 0 0.3rem;
    }

    .sidebar-level-2 {
      padding-left: 0.35rem;
      border-left: 1px dashed #e3e9f2;
      margin-left: 0.55rem;
    }

    .sidebar-level-3 {
      padding-left: 0.35rem;
      border-left: 1px dashed #eef2f7;
      margin-left: 0.55rem;
    }

    .sidebar-link-tool {
      font-size: 0.88rem;
      padding-left: 0.8rem;
    }

    .toggle-meta {
      color: var(--text-soft);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .main-panel {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .content-wrap {
      padding: 1.25rem 1.5rem 2rem;
    }

    .content-inner {
      max-width: 1360px;
      margin: 0 auto;
    }

    .content-inner.content-reading {
      max-width: 980px;
    }

    .mobile-toc {
      display: none;
      margin-bottom: 1rem;
    }

    .tool-layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 1.25rem;
      align-items: start;
      position: relative;
      z-index: 1;
    }

    .tool-col {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .tool-col-form {
      position: static;
    }

    .tool-card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: var(--shadow-soft);
      padding: 1.25rem;
      position: relative;
      z-index: 1;
    }

    .tool-card + .tool-card {
      margin-top: 1rem;
    }

    .footer-wrap {
      border-top: 1px solid var(--line);
      margin-top: 2rem;
      padding-top: 1rem;
    }

    .footer-links a {
      color: var(--text-soft);
      text-decoration: none;
      margin-right: 1rem;
    }

    .footer-links a:hover {
      color: var(--brand);
    }

    body.sidebar-collapsed .layout-row {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    body.sidebar-collapsed .sidebar-panel-wrap {
      min-width: 0;
      max-width: 0;
      width: 0;
      border-right: 0;
      overflow: hidden;
    }

    @media (min-width: 1200px) {
      .content-wrap {
        padding: 1.4rem 1.75rem 2.25rem;
      }

      .tool-col-form {
        position: sticky;
        top: calc(var(--topbar-h) + 1rem);
        align-self: start;
      }
    }

    @media (max-width: 1199.98px) {
      .tool-layout {
        grid-template-columns: 1fr;
      }

      .tool-col-form {
        position: static;
        top: auto;
      }

      .topbar .navbar-nav {
        flex-wrap: wrap;
      }

      .topbar-links-meta {
        margin-left: 0;
      }
    }

    @media (max-width: 991.98px) {
      .layout-row {
        display: block;
      }

      .sidebar-panel-wrap {
        display: none;
      }

      .mobile-toc {
        display: block;
      }

      .content-wrap {
        padding: 1rem;
      }

      .content-inner,
      .content-inner.content-reading {
        max-width: 100%;
      }

      #sidebarToggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .topbar-links-meta {
        display: none;
      }
    }

    @media (max-width: 575.98px) {
      .brand-text-sub {
        display: none;
      }

      .brand-text-main {
        font-size: 0.98rem;
      }

      .brand-logo,
      .brand-logo img {
        width: 34px;
        height: 34px;
      }

      .content-wrap {
        padding: 0.85rem;
      }
    }
  </style>
